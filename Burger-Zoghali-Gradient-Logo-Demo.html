<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آزمون رنگ نشانه | برگر ذغالی</title>
<style>
  :root{color-scheme:dark;--black:#171717;--white:#F5F4F1;--red:#A3121B}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--black);font-family:Tahoma,Arial,sans-serif}
  .slide{direction:ltr;width:100%;max-width:4400px;aspect-ratio:4400/2283;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .preview{background:var(--selected,#A3121B);display:grid;place-items:center;transition:background-color .1s linear}
  .mark{height:38%;width:auto;aspect-ratio:386.223/280.713;--ink:#F5F4F1;--outline:#F5F4F1}
  .mark svg{display:block;width:100%;height:100%}
  .mark .cls-1,.mark .cls-2{fill:var(--ink)}
  .mark .cls-2{fill-rule:evenodd}
  .mark .cls-3{fill:none;stroke:var(--outline);stroke-miterlimit:10;stroke-width:5px}
  .picker{direction:ltr;background:#242426;color:#F5F4F1;padding:clamp(28px,1.8vw,80px);display:grid;place-items:center;border-left:1px solid #171717}
  .picker-body{width:100%;max-width:1840px;display:flex;flex-direction:column;gap:clamp(24px,1.1vw,48px);min-width:0}
  .color-area{display:grid;grid-template-columns:minmax(0,1fr) clamp(28px,1.4vw,62px);gap:clamp(16px,.75vw,33px);align-items:stretch;min-width:0}
  .sv-wrap,.hue-wrap{position:relative;min-width:0}
  .sv-wrap{aspect-ratio:1;border:1px solid #777}
  .hue-wrap{height:100%;border:1px solid #777}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .sv-cursor{position:absolute;width:clamp(18px,.75vw,32px);height:clamp(18px,.75vw,32px);border:2px solid #fff;border-radius:50%;
    box-shadow:0 0 0 1px #171717,0 2px 8px #0009;pointer-events:none;transform:translate(-50%,-50%)}
  .hue-cursor{position:absolute;left:-6px;right:-6px;height:clamp(6px,.25vw,11px);border:2px solid #fff;
    box-shadow:0 0 0 1px #151515;pointer-events:none;transform:translateY(-50%)}
  .models{direction:ltr;display:grid;grid-template-columns:1fr 1.1fr 1.34fr 1.1fr;gap:0;min-width:0;border-top:1px solid #505052;padding-top:clamp(22px,1vw,44px)}
  .model-row{min-width:0;padding:0 clamp(10px,.85vw,38px);border-left:1px solid #505052}
  .model-row:first-child{border-left:0;padding-left:0}
  .model-row:last-child{padding-right:0}
  .model-name{display:block;margin-bottom:clamp(11px,.55vw,24px);font:700 clamp(12px,.6vw,27px) Arial,sans-serif;letter-spacing:.08em;color:#D3D3D4;direction:ltr;text-align:left}
  .model-values{direction:ltr;display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:clamp(4px,.26vw,11px);min-width:0}
  .value-box{min-width:0;display:flex;align-items:center;gap:clamp(2px,.16vw,7px);background:#353537;border:1px solid #606063;
    padding:clamp(5px,.3vw,13px);height:clamp(36px,1.95vw,86px)}
  .value-box:focus-within{border-color:#E3E3E3}
  .value-box span{font:700 clamp(10px,.43vw,19px) Arial,sans-serif;color:#AAAAAC;flex:none}
  .value-box input{width:100%;min-width:0;padding:0;border:0;outline:0;background:none;color:#fff;
    font:600 clamp(11px,.5vw,22px) Arial,sans-serif;text-align:left;direction:ltr}
  .value-box input[type=number]{appearance:textfield;-moz-appearance:textfield}
  .value-box input::-webkit-outer-spin-button,.value-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .value-box input.invalid{color:#FF9797}
  @media(max-width:1150px){
    .picker{padding:22px}.picker-body{gap:18px}
    .color-area{width:min(100%,370px);margin:0 auto}
    .models{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:22px}
    .model-row:nth-child(3){border-left:0;padding-left:0}
    .model-row:nth-child(2){padding-right:0}
    .value-box{padding:5px}.value-box span{font-size:10px}.value-box input{font-size:11px}
  }
  @media(max-width:800px){
    .slide{display:flex;flex-direction:column;aspect-ratio:auto;overflow:visible}
    .preview{height:440px;min-height:0}.mark{height:38%;width:auto}
    .picker{padding:24px;min-height:540px}
  }
  @media(max-width:580px){
    .preview{height:360px}.picker{padding:18px;min-height:0}
    .color-area{grid-template-columns:minmax(0,1fr) 25px;gap:12px}
    .models{gap:18px}.model-row{padding:0 10px}.model-name{margin-bottom:8px}
    .value-box{height:40px;padding:5px}
  }
</style>
</head>

  <section class="picker" aria-label="انتخابگر کامل رنگ">
    <div class="picker-body">
      <div class="color-area">
        <div class="sv-wrap" id="svWrap"><canvas id="sv" aria-label="اشباع و روشنایی"></canvas><span class="sv-cursor" id="svCursor" aria-hidden="true"></span></div>
        <div class="hue-wrap"><canvas id="hue" aria-label="طیف رنگ"></canvas><span class="hue-cursor" id="hueCursor" aria-hidden="true"></span></div>
      </div>
      <div class="models">
        <div class="model-row"><span class="model-name">HEX</span>
          <div class="model-values" style="--count:1"><label class="value-box"><span>#</span><input id="hex" type="text" maxlength="6" spellcheck="false" autocomplete="off" aria-label="HEX بدون علامت"></label></div>
        </div>
        <div class="model-row"><span class="model-name">RGB</span>
          <div class="model-values" style="--count:3">
            <label class="value-box"><span>R</span><input id="r" type="number" min="0" max="255" inputmode="numeric" aria-label="Red"></label>
            <label class="value-box"><span>G</span><input id="g" type="number" min="0" max="255" inputmode="numeric" aria-label="Green"></label>
            <label class="value-box"><span>B</span><input id="b" type="number" min="0" max="255" inputmode="numeric" aria-label="Blue"></label>
          </div>
        </div>
        <div class="model-row"><span class="model-name">CMYK</span>
          <div class="model-values" style="--count:4">
            <label class="value-box"><span>C</span><input id="c" type="number" min="0" max="100" inputmode="numeric" aria-label="Cyan percent"></label>
            <label class="value-box"><span>M</span><input id="m" type="number" min="0" max="100" inputmode="numeric" aria-label="Magenta percent"></label>
            <label class="value-box"><span>Y</span><input id="y" type="number" min="0" max="100" inputmode="numeric" aria-label="Yellow percent"></label>
            <label class="value-box"><span>K</span><input id="k" type="number" min="0" max="100" inputmode="numeric" aria-label="Black percent"></label>
          </div>
        </div>
        <div class="model-row"><span class="model-name">HSB</span>
          <div class="model-values" style="--count:3">
            <label class="value-box"><span>H</span><input id="h" type="number" min="0" max="360" inputmode="numeric" aria-label="Hue degrees"></label>
            <label class="value-box"><span>S</span><input id="s" type="number" min="0" max="100" inputmode="numeric" aria-label="Saturation percent"></label>
            <label class="value-box"><span>B</span><input id="v" type="number" min="0" max="100" inputmode="numeric" aria-label="Brightness percent"></label>
          </div>
        </div>
      </div>

</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const preview=$('preview'),mark=$('mark'),sv=$('sv'),hue=$('hue');
  const hInput=$('h'),sInput=$('s'),vInput=$('v'),rInput=$('r'),gInput=$('g'),bInput=$('b');
  const cInput=$('c'),mInput=$('m'),yInput=$('y'),kInput=$('k'),hexInput=$('hex');
  const BLACK='#171717',WHITE='#F5F4F1',RED='#A3121B';
  const state={h:0,s:0,v:0};
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||0));
  const toHex=a=>'#'+a.map(n=>Math.round(n).toString(16).padStart(2,'0')).join('').toUpperCase();
  function hexToRgb(value){
    const match=/^#?([\da-f]{3}|[\da-f]{6})$/i.exec(value.trim());
    if(!match)return null;
    const h=match[1].length===3?[...match[1]].map(c=>c+c).join(''):match[1];
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  }
  function hsvToRgb(h,s,v){
    h=((h%360)+360)%360;s/=100;v/=100;
    const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
    const a=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
    return a.map(z=>Math.round((z+m)*255));
  }
  function rgbToHsv([r,g,b]){
    r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
    let h=0;if(d)h=max===r?60*(((g-b)/d)%6):max===g?60*((b-r)/d+2):60*((r-g)/d+4);
    return {h:(h+360)%360,s:max?d/max*100:0,v:max*100};
  }
  function rgbToCmyk([r,g,b]){
    r/=255;g/=255;b/=255;const k=1-Math.max(r,g,b);
    if(k>=1)return [0,0,0,100];
    return [(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(n=>Math.round(n*100));
  }
  function cmykToRgb([c,m,y,k]){
    return [c,m,y].map(n=>Math.round(255*(1-n/100)*(1-k/100)));
  }
  function lum(rgb){
    const q=rgb.map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4});
    return .2126*q[0]+.7152*q[1]+.0722*q[2];
  }
  function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  function choose(color){
    const two=[{name:'سفید با کادر قرمز',ink:WHITE,ring:RED},{name:'مشکی با کادر قرمز',ink:BLACK,ring:RED}];
    const acceptable=two.filter(v=>contrast(hexToRgb(v.ink),color)>=4&&contrast(hexToRgb(v.ring),color)>=3);
    if(acceptable.length)return acceptable.sort((a,b)=>contrast(hexToRgb(b.ink),color)-contrast(hexToRgb(a.ink),color))[0];
    return [WHITE,BLACK].map(ink=>({name:ink===WHITE?'سفید تک‌رنگ':'مشکی تک‌رنگ',ink,ring:ink}))
      .sort((a,b)=>contrast(hexToRgb(b.ink),color)-contrast(hexToRgb(a.ink),color))[0];
  }
  function render(){
    const color=hsvToRgb(state.h,state.s,state.v),hex=toHex(color),variant=choose(color);
    preview.style.setProperty('--selected',hex);
    mark.style.setProperty('--ink',variant.ink);mark.style.setProperty('--outline',variant.ring);
    hexInput.value=hex.slice(1);hexInput.classList.remove('invalid');
    hInput.value=Math.round(state.h);sInput.value=Math.round(state.s);vInput.value=Math.round(state.v);
    [rInput,gInput,bInput].forEach((el,i)=>el.value=color[i]);
    const cmyk=rgbToCmyk(color);[cInput,mInput,yInput,kInput].forEach((el,i)=>el.value=cmyk[i]);
    $('svCursor').style.left=state.s+'%';$('svCursor').style.top=(100-state.v)+'%';
    $('hueCursor').style.top=(100-state.h/360*100)+'%';
  }
  function paint(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    for(const canvas of [sv,hue]){
      const box=canvas.getBoundingClientRect();
      canvas.width=Math.max(1,Math.round(box.width*dpr));canvas.height=Math.max(1,Math.round(box.height*dpr));
    }
    let ctx=sv.getContext('2d'),w=sv.width/dpr,h=sv.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='hsl('+state.h+' 100% 50%)';ctx.fillRect(0,0,w,h);
    let white=ctx.createLinearGradient(0,0,w,0);white.addColorStop(0,'#fff');white.addColorStop(1,'#fff0');
    ctx.fillStyle=white;ctx.fillRect(0,0,w,h);
    let black=ctx.createLinearGradient(0,0,0,h);black.addColorStop(0,'#0000');black.addColorStop(1,'#000');
    ctx.fillStyle=black;ctx.fillRect(0,0,w,h);
    ctx=hue.getContext('2d');w=hue.width/dpr;h=hue.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let rainbow=ctx.createLinearGradient(0,0,0,h);
    for(let i=0;i<=6;i++)rainbow.addColorStop(i/6,'hsl('+(360-i*60)+' 100% 50%)');
    ctx.fillStyle=rainbow;ctx.fillRect(0,0,w,h);
    render();
  }
  function moveSquare(e){
    const box=sv.getBoundingClientRect();
    state.s=clamp((e.clientX-box.left)/box.width*100,0,100);
    state.v=clamp((1-(e.clientY-box.top)/box.height)*100,0,100);render();
  }
  function moveHue(e){
    const box=hue.getBoundingClientRect();
    state.h=clamp((1-(e.clientY-box.top)/box.height)*360,0,360);paint();
  }
  sv.addEventListener('pointermove',e=>{if(e.buttons)moveSquare(e)});
  sv.addEventListener('pointerdown',e=>{sv.setPointerCapture(e.pointerId);moveSquare(e)});
  hue.addEventListener('pointermove',e=>{if(e.buttons)moveHue(e)});
  hue.addEventListener('pointerdown',e=>{hue.setPointerCapture(e.pointerId);moveHue(e)});
  for(const input of [hInput,sInput,vInput])input.addEventListener('change',()=>{
    state.h=clamp(hInput.value,0,360);state.s=clamp(sInput.value,0,100);state.v=clamp(vInput.value,0,100);paint();
  });
  for(const input of [rInput,gInput,bInput])input.addEventListener('change',()=>{
    Object.assign(state,rgbToHsv([rInput,gInput,bInput].map(el=>clamp(el.value,0,255))));paint();
  });
  for(const input of [cInput,mInput,yInput,kInput])input.addEventListener('change',()=>{
    const values=[cInput,mInput,yInput,kInput].map(el=>clamp(el.value,0,100));
    Object.assign(state,rgbToHsv(cmykToRgb(values)));paint();
  });
  function updateHex(){
    const color=hexToRgb(hexInput.value);
    if(!color){hexInput.classList.add('invalid');return}
    Object.assign(state,rgbToHsv(color));paint();
  }
  hexInput.addEventListener('input',updateHex);
  hexInput.addEventListener('change',updateHex);
  hexInput.addEventListener('blur',()=>{if(hexInput.classList.contains('invalid'))render()});
  if('ResizeObserver' in window)new ResizeObserver(paint).observe($('svWrap'));
  else window.addEventListener('resize',paint);
  Object.assign(state,rgbToHsv(hexToRgb(RED)));paint();
})();
</script>
